<html lang="en">
<head>
<meta charset="utf-8">

<meta name="description" content="Zoni Skin Care. Face creams, serums, face wash, hair removal and more. Order on WhatsApp. Delivery all over Bangladesh.">

<link rel="icon" type="image/png" href="favicon.png">

<title>Zoni Skin Care</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=DM+Sans:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap">
<style>
/* Layout: fluid column up to 1180px. Header with brand, small WhatsApp and Facebook icons, desktop nav. Featured row (swipe on phones, four across on desktop), search, category chips, product grid, payment-aware order sheet. Bottom tab bar on phones only. */
:root {
  --bg: #FFF5F8;
  --surface: #FFFFFF;
  --ink: #2A1620;
  --muted: #7A5A68;
  --line: #F0D9E1;
  --accent: #C2185B;
  --accent-ink: #FFFFFF;
  --soft: #FCE4EC;
  --gold: #8A5E1C;
  --shadow: 0 -12px 40px rgba(42, 22, 32, 0.2);
  --f-display: 'Playfair Display', Georgia, 'Noto Sans Bengali', serif;
  --f-pay: 'Inter', 'Noto Sans Bengali', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'DM Sans', 'Noto Sans Bengali', 'Segoe UI', system-ui, sans-serif;
  --gap: clamp(10px, 1.6vw, 20px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1015; --surface: #26161D; --ink: #FBEFF3; --muted: #D1A9B8; --line: #40262F;
    --accent: #F26BA2; --accent-ink: #2A0D18; --soft: #34202A; --gold: #D9B26A;
    --shadow: 0 -12px 40px rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1015; --surface: #26161D; --ink: #FBEFF3; --muted: #D1A9B8; --line: #40262F;
  --accent: #F26BA2; --accent-ink: #2A0D18; --soft: #34202A; --gold: #D9B26A;
  --shadow: 0 -12px 40px rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 10px; display: flex; align-items: center; gap: 14px; }
.brand { flex: 1; margin: 0; }
.brandbtn { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 0; text-align: left; }
.logo { width: 46px; height: 46px; border-radius: 50%; flex: none; display: block; }
.bname { font-family: var(--f-display); font-weight: 700; font-size: 24px; letter-spacing: -0.01em; line-height: 1; }
.bname small { display: block; font-family: var(--f-body); font-weight: 600; font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold); margin-top: 4px; }

.nav { display: none; gap: 6px; }
.navbtn { border: 0; background: none; padding: 8px 14px; border-radius: 999px; font-weight: 600; color: var(--muted); position: relative; }
.navbtn[aria-current="page"] { background: var(--soft); color: var(--accent); }
.navbtn .dot { position: static; display: inline-grid; margin-left: 6px; vertical-align: 1px; }
.social { display: flex; gap: 8px; flex: 1; justify-content: flex-end; }
.sbtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--accent); display: grid; place-items: center; text-decoration: none; }
.sbtn svg { width: 19px; height: 19px; }
.sbtn:hover { background: var(--soft); }

/* home */
.hero { padding-block: 8px 6px; }
.hero2 { display: grid; gap: 24px; padding: clamp(20px, 4vw, 52px); border-radius: 28px; background: linear-gradient(120deg, var(--soft) 0%, var(--bg) 100%); border: 1px solid var(--line); margin-top: 6px; }
.eyebrow { font-weight: 600; letter-spacing: 0.03em; color: var(--accent); font-size: 14px; }
.lead { font-family: var(--f-display); font-size: clamp(36px, 5.6vw, 66px); line-height: 1.03; letter-spacing: -0.02em; margin: 8px 0 14px; text-wrap: balance; }
.lead em { color: var(--accent); font-style: italic; font-weight: 600; }
.cta-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.btn { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 14px 26px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; }
.ghost.pill { border-radius: 999px; padding: 13px 22px; }
.trust { list-style: none; margin: 22px 0 0; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.trust li { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.trust svg { width: 26px; height: 26px; color: var(--accent); flex: none; }
.trust b { font-size: 12.5px; line-height: 1.25; font-weight: 600; }
@media (min-width: 640px) { .trust li { flex-direction: row; text-align: left; gap: 10px; } .trust b { font-size: 14px; } }
.hvis { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: clamp(8px, 1.4vw, 16px); align-items: center; }
.hv { border: 0; padding: 0; background: var(--surface); border-radius: 20px; overflow: hidden; aspect-ratio: 3 / 4; box-shadow: 0 10px 30px rgba(194, 24, 91, 0.14); }
.hv:nth-child(2) { aspect-ratio: 3 / 4.3; }
.hv img { width: 100%; height: 100%; object-fit: cover; display: block; }
.block { margin-top: clamp(30px, 5vw, 60px); }
.cats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); }
.cat-tile { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 10px 10px 14px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.cat-tile:hover { border-color: var(--accent); }
.cat-tile img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 14px; margin-bottom: 8px; display: block; }
.cat-tile b { font-weight: 600; }
.cat-tile small { color: var(--muted); font-size: 13px; }
.promo { display: block; width: 100%; padding: 0; border: 0; border-radius: 22px; overflow: hidden; background: var(--soft); }
.promo img { width: 100%; height: auto; display: block; }
section[id] { scroll-margin-top: 84px; }
.foot2 { margin-top: clamp(36px, 6vw, 64px); background: var(--soft); border-radius: 28px; padding: clamp(30px, 5vw, 56px) 20px; text-align: center; color: var(--muted); font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
.flogo { width: 88px; height: 88px; border-radius: 50%; display: block; }
.fname { font-family: var(--f-display); font-size: 24px; font-weight: 700; color: var(--ink); line-height: 1.1; }
.ftag { margin-top: -12px; }
.flinks { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.fl { border: 0; background: none; padding: 2px 0; font-size: 11.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink); text-decoration: none; }
.fl:hover { color: var(--accent); }
.fsoc { display: flex; gap: 12px; }
.fsq { width: 46px; height: 46px; display: grid; place-items: center; color: var(--ink); text-decoration: none; border: 1px solid color-mix(in srgb, var(--muted) 45%, transparent); background: transparent; }
.fsq:hover { background: var(--surface); color: var(--accent); }
.fsq svg { width: 20px; height: 20px; }
.fphone { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); font-weight: 600; font-size: 15px; text-decoration: none; }
.fphone svg { width: 17px; height: 17px; color: var(--accent); }
.stores { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.store { display: flex; align-items: center; gap: 10px; background: #111; color: #fff; border: 1px solid #555; border-radius: 12px; padding: 8px 18px 8px 12px; text-align: left; text-decoration: none; min-width: 160px; }
.store svg, .store img { width: 28px; height: 28px; flex: none; }
.store small { display: block; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.8; }
.store b { display: block; font-size: 16px; line-height: 1.15; font-weight: 600; }
.store:disabled { opacity: 0.7; cursor: not-allowed; }
.cr { margin: 0; font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; }
.pays { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.pay img { height: 30px; width: auto; max-width: none; flex: none; display: block; }
.pay.plogo { padding: 0 12px; height: 44px; flex: none; }
.pay { background: #fff; border: 1px solid rgba(0, 0, 0, 0.08); border-radius: 10px; height: 38px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.pay svg { width: 20px; height: 20px; }
.pay.bkash { color: #E2136E; font-style: italic; }
.pay.nagad { color: #E8590C; }
.pay.rocket { color: #8C3494; }
.pay.bank { color: #1565C0; }
.pay.cardpay { color: #37474F; }
.fnote { margin: 0; font-size: 12px; }
.allb { border-radius: 28px; padding: clamp(20px, 3.5vw, 40px); background: linear-gradient(115deg, #7D0F47 0%, #C2185B 58%, #D9567F 100%); color: #fff; overflow: hidden; }
.allb-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 24px; }
.allb-t { display: flex; align-items: center; gap: 16px; min-width: 0; }
.allb-logo { width: 64px; height: 64px; border-radius: 50%; flex: none; border: 2px solid rgba(255, 255, 255, 0.5); }
.allb-eye { font-size: 12.5px; letter-spacing: 0.12em; text-transform: uppercase; color: #F6D9A8; font-weight: 600; }
.allb h2 { font-family: var(--f-display); font-size: clamp(24px, 3.4vw, 40px); line-height: 1.1; letter-spacing: -0.01em; margin: 4px 0 0; text-wrap: balance; }
.allb h2 em { color: #F6D9A8; font-style: italic; }
.btn.gold { background: #F6D9A8; color: #4A1030; }
.marq { margin-top: 22px; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent); mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent); }
.track { display: flex; gap: 12px; width: max-content; animation: slide 70s linear infinite; }
.marq:hover .track, .marq:focus-within .track { animation-play-state: paused; }
@keyframes slide { to { transform: translateX(calc(-50% - 6px)); } }
.mt { flex: none; width: clamp(104px, 13vw, 148px); aspect-ratio: 4 / 5; padding: 0; border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 16px; overflow: hidden; background: #fff; }
.mt img { width: 100%; height: 100%; object-fit: cover; display: block; }
@media (prefers-reduced-motion: reduce) { .track { animation: none; } .marq { overflow-x: auto; } }
.sub { color: var(--muted); margin: 0 0 18px; max-width: 46ch; font-size: 16px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 14px 0 10px; }
.sec-head h2 { font-family: var(--f-display); font-size: clamp(20px, 2.4vw, 28px); letter-spacing: -0.01em; margin: 0; }
.sec-head span { color: var(--muted); font-size: 13.5px; }
.feat-row { display: flex; gap: var(--gap); overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px; scrollbar-width: none; }
.feat-row::-webkit-scrollbar { display: none; }
.fcard { flex: 0 0 min(64%, 250px); scroll-snap-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.fopen { border: 0; background: none; padding: 0; text-align: left; display: flex; flex-direction: column; flex: 1; }
.fcard .info { padding: 12px 14px 8px; }
.mini { margin: 4px 14px 14px; border: 1px solid var(--accent); background: none; color: var(--accent); border-radius: 12px; padding: 9px 12px; font-weight: 600; }
.mini:hover { background: var(--accent); color: var(--accent-ink); }

.search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; max-width: 560px; display: block; }
.search::placeholder { color: var(--muted); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--gap); margin-top: 14px; }
.card { text-align: left; padding: 0; background: var(--surface); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; border: 1px solid var(--line); }
.card:hover, .fcard:hover { border-color: var(--accent); }
.ph { background: var(--soft); aspect-ratio: 4 / 5; position: relative; overflow: hidden; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.badge { position: absolute; top: 8px; left: 8px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px; }
.info { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.cat { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.name { font-weight: 600; line-height: 1.25; }
.meta { color: var(--muted); font-size: 13px; }
.empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 36px 0; }
.recs { grid-column: 1 / -1; font-family: var(--f-display); font-size: 20px; letter-spacing: -0.01em; margin: 14px 0 0; }
.price { margin-top: auto; padding-top: 6px; font-variant-numeric: tabular-nums; }
.price b { font-weight: 600; }
.price s { color: var(--muted); font-size: 13px; margin-left: 6px; }
.price.ask { color: var(--muted); font-size: 13px; }
.pbox { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
.pbox strong { font-family: var(--f-body); font-weight: 700; font-size: 26px; color: var(--accent); }
.pbox s { color: var(--muted); }
.pbox span { background: var(--soft); color: var(--accent); font-size: 12.5px; font-weight: 600; border-radius: 999px; padding: 2px 10px; }

.foot { margin-top: 32px; padding-block: 22px 8px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; display: grid; gap: 6px; }
.foot b { color: var(--ink); }

/* order page */
h2.screen { font-family: var(--f-display); font-size: clamp(26px, 3vw, 36px); letter-spacing: -0.02em; margin: 8px 0 12px; }
.hint { background: var(--soft); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; color: var(--muted); margin: 0 0 8px; }
.cartgrid { display: grid; gap: 18px; align-items: start; }
.line { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.line .ph { aspect-ratio: 1 / 1; border-radius: 12px; }
.line .name { font-size: 14.5px; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); margin-top: 6px; }
.qty button { width: 32px; height: 32px; border: 0; background: none; font-size: 18px; line-height: 1; }
.qty output { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
.total { display: flex; justify-content: space-between; align-items: baseline; font-variant-numeric: tabular-nums; }
.total strong { font-size: 20px; }
.summary .small { margin: 0; font-size: 13px; color: var(--muted); }

.primary { width: 100%; border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 14px; padding: 15px 18px; font-weight: 600; font-size: 16px; display: flex; justify-content: center; align-items: center; gap: 10px; text-decoration: none; text-align: center; }
.primary svg { width: 20px; height: 20px; }
a.primary { color: var(--accent-ink); }
.ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 13px 18px; font-weight: 600; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.ghost svg { width: 19px; height: 19px; color: var(--accent); }

/* bottom tab bar, phones only */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tabs div { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tab { border: 0; background: none; padding: 8px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12.5px; color: var(--muted); position: relative; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 600; background: var(--soft); }
.dot { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 18px; height: 18px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 600; display: grid; place-items: center; padding: 0 5px; }

/* sheet: bottom sheet on phones, centred dialog on larger screens */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(20, 8, 14, 0.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { position: relative; width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--surface); border-radius: 24px 24px 0 0; box-shadow: var(--shadow); padding: 18px max(18px, env(safe-area-inset-right, 0px)) 0 max(18px, env(safe-area-inset-left, 0px)); animation: up 0.22s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
.closebar { position: sticky; top: 8px; height: 0; z-index: 3; }
.sheet .close { position: absolute; top: 0; right: 0; z-index: 2; border: 1px solid var(--line); background: var(--surface); width: 36px; height: 36px; border-radius: 50%; font-size: 20px; line-height: 1; }
.pcols { display: grid; gap: 14px; }
.sheet .hero { background: var(--soft); border-radius: 18px; height: 260px; overflow: hidden; }
.sheet .hero img { width: 100%; height: 100%; object-fit: contain; display: block; }
.thumbs { display: flex; gap: 8px; margin-top: 10px; }
.thumb { width: 56px; height: 70px; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--soft); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.sheet h3 { font-family: var(--f-display); font-size: 24px; letter-spacing: -0.02em; margin: 2px 0 4px; line-height: 1.15; }
.sheet p { margin: 8px 0; }
.sheet .bn { color: var(--muted); font-size: 14.5px; margin: 0 0 6px; }
.label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { background: var(--soft); border-radius: 999px; font-size: 13px; padding: 3px 10px; }
.size { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 14px; }
.pricelink { margin-top: 14px; }
.buy { position: sticky; bottom: 0; background: var(--surface); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; margin-top: 16px; padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
.buy .qty { margin: 0; }
.poster { width: 100%; height: auto; border-radius: 14px; display: block; border: 1px solid var(--line); }
.end { height: calc(20px + env(safe-area-inset-bottom, 0px)); }

/* checkout form and payment methods */
.form { display: grid; gap: 12px; margin-top: 10px; }
.form label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.form input[type="text"], .form input[type="tel"], .form textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px 14px; color: var(--ink); font-size: 16px; }
.form textarea { min-height: 84px; resize: vertical; }
.form .fine { font-size: 13px; color: var(--muted); margin: 0; }
.form .err { color: var(--accent); font-weight: 600; }
.pms { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }

  var DET = {
    1: { bd: '৩% স্যালিসাইলিক অ্যাসিডযুক্ত ক্রিম, ব্রণপ্রবণ ত্বকের জন্য। ব্রণ পরিষ্কার করতে, লোমকূপ ছোট দেখাতে ও ব্রণের দাগ হালকা করতে সাহায্য করে এবং ত্বককে পুষ্টি ও আর্দ্রতা দেয়।',
      why: [['Clears clogged pores', 'ছিদ্র পরিষ্কার করে', 'Salicylic acid is an oil-soluble BHA. It loosens dead skin and reaches inside the pore to clear the oil and debris behind blackheads and pimples.', 'স্যালিসাইলিক অ্যাসিড তেলে মিশে যায়। এটি মৃত ত্বক আলগা করে এবং লোমকূপের ভেতরের তেল ও ময়লা পরিষ্কার করে, যা ব্ল্যাকহেড ও ব্রণের কারণ।'],
        ['Builds up over weeks', 'কয়েক সপ্তাহে ফল দেখা যায়', 'It does not work overnight. Blackheads and breakouts usually look better after several weeks of regular use.', 'এক রাতে ফল হয় না। নিয়মিত কয়েক সপ্তাহ ব্যবহার করলে ব্ল্যাকহেড ও ব্রণ কম দেখায়।'],

      note: ['Start every other day. Keep away from eyes and broken skin. Use sunscreen in the morning. Ask a doctor first if you are pregnant or allergic to aspirin.', 'প্রথমে একদিন পর পর লাগান। চোখ ও কাটা ত্বক এড়িয়ে চলুন। সকালে সানস্ক্রিন ব্যবহার করুন। গর্ভবতী হলে বা অ্যাসপিরিনে অ্যালার্জি থাকলে আগে ডাক্তারের পরামর্শ নিন।'] },
    2: { bd: 'রেটিনল ও কোলাজেনযুক্ত ক্রিম, যা সূক্ষ্ম রেখা ও বলিরেখা নরম করে এবং ত্বক টানটান, মসৃণ ও উজ্জ্বল রাখতে সাহায্য করে। সব ধরনের ত্বকের জন্য।',
      why: [['Retinol renews skin', 'রেটিনল ত্বক নতুন করে', 'Retinol speeds up skin renewal and supports the skin’s own collagen, so fine lines and rough texture can look softer with regular use over weeks to months.', 'রেটিনল ত্বকের নতুন কোষ তৈরি দ্রুত করে এবং নিজস্ব কোলাজেনকে সাহায্য করে। কয়েক সপ্তাহ থেকে মাস নিয়মিত ব্যবহারে সূক্ষ্ম রেখা নরম দেখায়।'],
        ['Locks in moisture', 'আর্দ্রতা ধরে রাখে', 'Hyaluronic acid, glycerin and collagen hold water on the surface. Hydrated skin looks plumper and smoother.', 'হায়ালুরনিক অ্যাসিড, গ্লিসারিন ও কোলাজেন ত্বকে পানি ধরে রাখে। আর্দ্র ত্বক ভরাট ও মসৃণ দেখায়।'],
        ['Vitamin E protects', 'ভিটামিন ই সুরক্ষা দেয়', 'Vitamin E is an antioxidant that helps protect skin from everyday stress.', 'ভিটামিন ই একটি অ্যান্টিঅক্সিডেন্ট, যা প্রতিদিনের ক্ষতি থেকে ত্বককে রক্ষা করতে সাহায্য করে।']],
      note: ['Retinol can cause dryness or redness at first, so start slowly. Always use sunscreen in the daytime. Ask a doctor first if you are pregnant or breastfeeding.', 'রেটিনল প্রথমে ত্বক শুষ্ক বা লাল করতে পারে, তাই ধীরে শুরু করুন। দিনে অবশ্যই সানস্ক্রিন লাগান। গর্ভবতী বা বুকের দুধ খাওয়ালে আগে ডাক্তারের পরামর্শ নিন।'] },
    3: { bd: 'হালকা আর্দ্রতার ক্রিম, যা ত্বকে পানি ধরে রাখে এবং শুষ্কতা ও খসখসে ভাব কমাতে সাহায্য করে। সব ধরনের ত্বকের জন্য।', bu: 'ক্লিনজিংয়ের পর মুখে হালকা হাতে পরিমাণমতো ক্রিম মালিশ করুন। দিনে দুইবার ব্যবহার করুন।',

        ['Seals and softens', 'আর্দ্রতা আটকে নরম করে', 'The cream layer slows water loss, and milk protein helps skin feel soft and smooth.', 'ক্রিমের স্তর পানি হারানো কমায় এবং দুধের প্রোটিন ত্বক নরম ও মসৃণ রাখে।']],
      note: ['Gentle enough for daily use. Try a small amount on your inner arm first if your skin is sensitive.', 'প্রতিদিন ব্যবহারের জন্য হালকা। ত্বক সংবেদনশীল হলে আগে হাতের ভেতরে অল্প লাগিয়ে দেখুন।'] },
    4: { bd: 'চাল থেকে পাওয়া রাইস পলিপেপটাইডযুক্ত ময়েশ্চারাইজিং নেক ক্রিম। গলার সূক্ষ্ম রেখা কম দেখাতে সাহায্য করে এবং ত্বক নরম, মসৃণ ও স্থিতিস্থাপক রাখে।', bu: 'গলা ধুয়ে শুকিয়ে নিন। ক্রিম ওপরের দিকে মালিশ করুন। প্রতি রাতে ব্যবহার করুন।',
      why: [['Hydrates thin neck skin', 'গলার পাতলা ত্বকে আর্দ্রতা', 'Neck skin is thinner and dries out easily. Rice-based peptides and moisturizers help it hold water, so lines look softer.', 'গলার ত্বক পাতলা ও সহজে শুষ্ক হয়। রাইস পেপটাইড ও ময়েশ্চারাইজার পানি ধরে রাখে, ফলে রেখা নরম দেখায়।'],
        ['Upward massage', 'ওপরের দিকে মালিশ', 'Massaging upward helps the cream spread evenly and feels firming on the skin.', 'ওপরের দিকে মালিশ করলে ক্রিম সমানভাবে ছড়ায় এবং ত্বক টানটান লাগে।']],
      note: ['Use sunscreen on the neck in the daytime. Results vary from person to person.', 'দিনে গলায় সানস্ক্রিন লাগান। ফল মানুষভেদে আলাদা হতে পারে।'] },
    5: { bd: 'কোলাজেন ফেস ক্রিম, যা ত্বক টানটান ও বলিরেখা নরম করতে সাহায্য করে এবং ত্বককে গভীরভাবে আর্দ্র, মসৃণ ও উজ্জ্বল রাখে।', bu: 'সকাল ও রাতে ব্যবহার করুন।',

    7: { bd: 'নিকোটিনামাইড ক্রিম, যা নিস্তেজ ভাব ও কালো দাগ হালকা করতে সাহায্য করে এবং ত্বক উজ্জ্বল, নরম ও মসৃণ রাখে।', bu: 'মুখ ভালো করে ধুয়ে নিন। হাত ধুয়ে শুকিয়ে রাতে অল্প পরিমাণ ক্রিম লাগান।',
      why: [['Slows pigment spread', 'রঙের ছড়িয়ে পড়া কমায়', 'Niacinamide (vitamin B3) reduces the transfer of pigment to skin cells. Reviews report that it can lessen dark spots with regular use.', 'নিকোটিনামাইড (ভিটামিন বি৩) ত্বকের কোষে রঙ (মেলানিন) যাওয়া কমায়। নিয়মিত ব্যবহারে কালো দাগ হালকা হতে পারে বলে গবেষণায় বলা হয়েছে।'],
        ['Supports the skin barrier', 'ত্বকের সুরক্ষা স্তর মজবুত', 'It also helps the skin barrier hold water, so skin looks smoother and brighter.', 'এটি ত্বকের সুরক্ষা স্তরকে পানি ধরে রাখতে সাহায্য করে, ফলে ত্বক মসৃণ ও উজ্জ্বল দেখায়।']],
      note: ['Results usually take several weeks. Use sunscreen daily, because sun can bring dark spots back.', 'ফল পেতে সাধারণত কয়েক সপ্তাহ লাগে। প্রতিদিন সানস্ক্রিন লাগান, নইলে রোদে দাগ আবার গাঢ় হতে পারে।'] },
    8: { bd: 'নিকোটিনামাইড এসেন্স, যা ফ্রেকল ও রঙের দাগ হালকা করতে সাহায্য করে। ত্বক আর্দ্র, মসৃণ, নরম ও উজ্জ্বল থাকে।',
      why: [['Niacinamide brightens', 'নিকোটিনামাইড উজ্জ্বলতা দেয়', 'Niacinamide reduces the transfer of pigment to skin cells, which can lessen freckles and dark marks over time.', 'নিকোটিনামাইড ত্বকের কোষে রঙ যাওয়া কমায়, ফলে সময়ের সাথে ফ্রেকল ও দাগ হালকা হতে পারে।'],
        ['Lightweight essence', 'হালকা এসেন্স', 'A thin essence sinks in fast and adds moisture without a heavy feel. Use it before your cream.', 'পাতলা এসেন্স দ্রুত ত্বকে মিশে যায় ও ভারী লাগে না। ক্রিমের আগে লাগান।']],
      note: ['Be patient: visible change usually takes several weeks. Use sunscreen in the morning.', 'ধৈর্য ধরুন, পরিবর্তন দেখতে সাধারণত কয়েক সপ্তাহ লাগে। সকালে সানস্ক্রিন লাগান।'] },
    9: { bd: 'মিনোক্সিডিল, কেরাটিন ও ব্ল্যাক রাইস নির্যাসযুক্ত হেয়ার সিরাম, চুল পড়া কমাতে ও নতুন চুল গজাতে সাহায্য করার জন্য। চুলের গোড়া মজবুত এবং চুল স্বাস্থ্যকর ও চকচকে রাখে। সব ধরনের চুলের জন্য।',
      why: [['Minoxidil supports regrowth', 'মিনোক্সিডিল চুল গজাতে সাহায্য করে', 'Minoxidil is used for hereditary hair loss. It usually takes 2 to 4 months of regular use before you see a change, and regrown hair can fall out again if you stop.', 'মিনোক্সিডিল বংশগত চুল পড়ায় ব্যবহার হয়। ফল দেখতে সাধারণত ২ থেকে ৪ মাস নিয়মিত ব্যবহার করতে হয়। ব্যবহার বন্ধ করলে নতুন চুল আবার পড়ে যেতে পারে।'],
        ['Keratin and black rice care', 'কেরাটিন ও ব্ল্যাক রাইস যত্ন', 'Keratin and black rice extract help condition hair, so strands feel smoother and look shinier.', 'কেরাটিন ও ব্ল্যাক রাইস নির্যাস চুল নরম করে, ফলে চুল মসৃণ ও চকচকে দেখায়।']],
      note: ['For use on the scalp only. Check the minoxidil percentage on the pack. Ask a doctor first for sudden or patchy hair loss, if you are pregnant or breastfeeding, or if your scalp is red or sore. Not for children.', 'শুধু মাথার ত্বকে ব্যবহার করুন। প্যাকে মিনোক্সিডিলের শতাংশ দেখে নিন। হঠাৎ বা ছোপ ছোপ চুল পড়লে, গর্ভবতী বা বুকের দুধ খাওয়ালে, বা মাথার ত্বক লাল বা ব্যথা হলে আগে ডাক্তারের পরামর্শ নিন। শিশুদের জন্য নয়।'] },
    10: { bd: 'ব্রণ সারানোর সিরাম, যা দ্রুত ব্রণ পরিষ্কার করতে সাহায্য করে। সেন্টেলা ও নিকোটিনামাইড ত্বককে শান্ত ও পুষ্ট রাখে, লোমকূপ ছোট দেখায় এবং গভীর আর্দ্রতা দেয়।',
      why: [['Clears pores', 'লোমকূপ পরিষ্কার করে', 'Salicylic acid goes into the pore and clears oil and dead skin that cause blackheads and pimples.', 'স্যালিসাইলিক অ্যাসিড লোমকূপের ভেতরে গিয়ে তেল ও মৃত ত্বক পরিষ্কার করে, যা ব্ল্যাকহেড ও ব্রণের কারণ।'],
        ['Centella calms', 'সেন্টেলা শান্ত করে', 'Centella asiatica is known for calming skin that feels red or irritated.', 'সেন্টেলা এশিয়াটিকা লাল বা জ্বালা করা ত্বককে শান্ত করার জন্য পরিচিত।'],
        ['Niacinamide balances', 'নিকোটিনামাইড ভারসাম্য রাখে', 'Niacinamide supports the skin barrier and helps fade the look of marks.', 'নিকোটিনামাইড ত্বকের সুরক্ষা স্তরকে সাহায্য করে এবং দাগ হালকা দেখাতে পারে।']],
      note: ['Start every other day and avoid the eye area. You may see small breakouts at first as pores clear. Use sunscreen in the morning. Ask a doctor first if you are pregnant or allergic to aspirin.', 'প্রথমে একদিন পর পর লাগান, চোখের চারপাশ এড়িয়ে চলুন। শুরুতে লোমকূপ পরিষ্কার হওয়ার সময় অল্প ব্রণ দেখা দিতে পারে। সকালে সানস্ক্রিন লাগান। গর্ভবতী বা অ্যাসপিরিনে অ্যালার্জি থাকলে আগে ডাক্তারের পরামর্শ নিন।'] },
    11: { bd: 'নিকোটিনামাইড ও ভিটামিন সি-যুক্ত সিরাম, হাতের গিঁটের কালো ভাব হালকা ও উজ্জ্বল করতে সাহায্য করে।',
      why: [['Niacinamide lightens', 'নিকোটিনামাইড হালকা করে', 'It reduces the transfer of pigment to skin cells, which can lessen dark patches over time.', 'এটি ত্বকের কোষে রঙ যাওয়া কমায়, ফলে সময়ের সাথে কালো ছোপ হালকা হতে পারে।'],
        ['Vitamin C brightens', 'ভিটামিন সি উজ্জ্বল করে', 'Vitamin C is an antioxidant that helps brighten dull skin and supports an even tone.', 'ভিটামিন সি একটি অ্যান্টিঅক্সিডেন্ট, যা নিস্তেজ ত্বক উজ্জ্বল ও সমান রঙ করতে সাহায্য করে।']],
      note: ['Apply on knuckles and other dark areas, then use sunscreen on exposed skin. Visible change takes several weeks.', 'গিঁট ও অন্য কালো জায়গায় লাগান, খোলা ত্বকে সানস্ক্রিন ব্যবহার করুন। পরিবর্তন দেখতে কয়েক সপ্তাহ লাগে।'] },
    12: { bd: 'হালকা আই সিরাম, যা চোখের নিচের কালো দাগ, ফোলাভাব ও সূক্ষ্ম রেখা কমাতে সাহায্য করে এবং আর্দ্রতা দেয়। প্যারাবেন ও সালফেট মুক্ত।', bu: 'পরিষ্কার ত্বকে অল্প পরিমাণ সিরাম চোখের চারপাশে আলতো করে চাপড় দিয়ে লাগান। সকাল ও রাতে ব্যবহার করুন।',
      why: [['Aloe and hyaluronic acid hydrate', 'অ্যালো ও হায়ালুরনিক অ্যাসিড আর্দ্রতা দেয়', 'Aloe vera soothes and hyaluronic acid holds water. Hydrated skin around the eyes makes fine lines look softer.', 'অ্যালোভেরা আরাম দেয় এবং হায়ালুরনিক অ্যাসিড পানি ধরে রাখে। চোখের চারপাশের ত্বক আর্দ্র থাকলে সূক্ষ্ম রেখা নরম দেখায়।'],
        ['Caffeine wakes up the look', 'ক্যাফেইন সতেজ দেখায়', 'Caffeine is often used to help tired, puffy eyes look fresher.', 'ক্লান্ত ও ফোলা চোখ সতেজ দেখাতে ক্যাফেইন প্রায়ই ব্যবহার হয়।']],
      note: ['Dark circles have many causes, such as sleep, genes and pigmentation, so a serum may soften their look but not remove them fully.', 'চোখের নিচের কালো দাগের অনেক কারণ আছে, যেমন ঘুম, বংশগতি ও রঙ। সিরাম দাগ হালকা দেখাতে পারে, পুরোপুরি দূর নাও করতে পারে।'] },
    13: { bd: 'নরম কোরাল ও গোলাপি শেডে লিপহপ লিপ গ্লস।',
      why: [['Shine and colour', 'উজ্জ্বলতা ও রঙ', 'A gloss reflects light, so lips look fuller and shinier, with a soft touch of colour.', 'গ্লস আলো ফেরায়, তাই ঠোঁট ভরাট ও চকচকে দেখায়, সাথে হালকা রঙ থাকে।']],
      note: ['Apply with the wand on clean lips and reapply when needed.', 'পরিষ্কার ঠোঁটে ওয়ান্ড দিয়ে লাগান, দরকারে আবার লাগান।'] },
    14: { bd: 'লিপহপের লিপ পেইন্ট, শেড "লাভ"।',
      why: [['Rich colour', 'গাঢ় রঙ', 'A liquid lip paint gives strong colour in one or two strokes and stays on longer than a gloss.', 'তরল লিপ পেইন্ট এক-দুই টানেই গাঢ় রঙ দেয় এবং গ্লসের চেয়ে বেশিক্ষণ থাকে।']],
      note: ['Prep lips with a balm first, then apply a thin layer and let it set.', 'আগে লিপ বাম লাগিয়ে নিন, তারপর পাতলা করে লাগিয়ে শুকাতে দিন।'] },
    15: { bd: 'গোলাপি ময়েশ্চারাইজিং লিপ কেয়ার সেট, যাতে লিপ জেল টিউব, লিপ জার ও ছোট অ্যাপ্লিকেটর ব্রাশ আছে।',
      why: [['Soft, moisturised lips', 'নরম ও আর্দ্র ঠোঁট', 'A lip gel and jar coat the lips and keep moisture in, so they feel soft and less dry.', 'লিপ জেল ও জার ঠোঁটে আস্তরণ দিয়ে আর্দ্রতা ধরে রাখে, ফলে ঠোঁট নরম ও কম শুষ্ক থাকে।']],
      note: ['Use the brush for a neat, even layer. Apply at night for extra care.', 'ব্রাশ দিয়ে সমান করে লাগান। বাড়তি যত্নের জন্য রাতে লাগান।'] },
    16: { bd: 'চালের নির্যাসযুক্ত গভীর পরিষ্কারের ফেস ওয়াশ। ত্বককে আরাম ও যত্ন দেয় এবং আর্দ্র ও কোমল রাখে।',
      why: [['Lifts oil and dirt', 'তেল ও ময়লা তোলে', 'A cleanser lifts oil, dirt and sweat so they rinse away, leaving pores cleaner.', 'ক্লিনজার তেল, ময়লা ও ঘাম তুলে ফেলে, ধুয়ে ফেললে লোমকূপ পরিষ্কার থাকে।'],
        ['Rice extract softens', 'চালের নির্যাস নরম করে', 'Rice extract is a gentle, soothing ingredient that helps skin feel soft after washing.', 'চালের নির্যাস মৃদু ও আরামদায়ক, যা ধোয়ার পর ত্বক নরম রাখে।']],
      note: ['Massage on wet face for about 30 seconds, then rinse well. Use morning and night.', 'ভেজা মুখে প্রায় ৩০ সেকেন্ড মালিশ করে ভালো করে ধুয়ে ফেলুন। সকালে ও রাতে ব্যবহার করুন।'] },
    17: { bd: 'চালের নির্যাসযুক্ত হেয়ার রিমুভাল ক্রিম। ব্যথা ছাড়াই দ্রুত লোম দূর করে, ত্বক উজ্জ্বল ও মসৃণ রাখে।',
      why: [['Dissolves hair at the surface', 'ত্বকের উপরে লোম গলায়', 'Hair removal creams contain thioglycolate salts that break down keratin, the protein in hair. The weakened hair then wipes off at skin level.', 'হেয়ার রিমুভাল ক্রিমে থায়োগ্লাইকোলেট লবণ থাকে, যা চুলের কেরাটিন প্রোটিন ভেঙে দেয়। দুর্বল লোম ত্বকের উপর থেকে মুছে ফেলা যায়।'],
        ['Painless and quick', 'ব্যথাহীন ও দ্রুত', 'It takes about 5 to 10 minutes or as the pack says. Smoothness usually lasts 3 to 7 days, because the root stays.', 'প্যাকের নির্দেশমতো সাধারণত ৫ থেকে ১০ মিনিট লাগে। গোড়া থাকে বলে মসৃণতা সাধারণত ৩ থেকে ৭ দিন থাকে।']],
      note: ['Patch test on your inner arm 24 to 48 hours before first use. Do not use on broken, sunburnt or irritated skin, or on the face or private areas unless the pack says so. Do not leave on longer than directed.', 'প্রথমবার ব্যবহারের ২৪ থেকে ৪৮ ঘণ্টা আগে হাতের ভেতরে প্যাচ টেস্ট করুন। কাটা, রোদে পোড়া বা জ্বালা করা ত্বকে এবং প্যাকে না থাকলে মুখ বা গোপন অঙ্গে ব্যবহার করবেন না। নির্দেশের চেয়ে বেশিক্ষণ রাখবেন না।'] },
    18: { bd: 'নিকোটিনামাইড ও ভিটামিন সি-যুক্ত হ্যান্ড ক্রিম, যা মেলানিন দাগ হালকা ও উজ্জ্বল করতে সাহায্য করে এবং হাতকে আর্দ্র ও পুষ্ট রাখে।',
      why: [['Brightens dull hands', 'নিস্তেজ হাত উজ্জ্বল করে', 'Niacinamide and vitamin C help even skin tone and lessen dark patches over time.', 'নিকোটিনামাইড ও ভিটামিন সি ত্বকের রঙ সমান করে এবং সময়ের সাথে কালো ছোপ হালকা করতে সাহায্য করে।'],
        ['Nourishes and softens', 'পুষ্টি ও কোমলতা', 'The cream base hydrates dry hands so they feel smooth and tender.', 'ক্রিম শুষ্ক হাতে আর্দ্রতা দেয়, ফলে হাত মসৃণ ও কোমল লাগে।']],
      note: ['Apply after washing and drying your hands, and use sunscreen on the backs of your hands in the daytime.', 'হাত ধুয়ে শুকানোর পর লাগান। দিনে হাতের পিঠে সানস্ক্রিন ব্যবহার করুন।'] }
  };

  var GAL = { 1:'abc',2:'abc',3:'abc',4:'abc',5:'abc',6:'abc',7:'abc',8:'abc',9:'abc',10:'abc',11:'abc',12:'abc',13:'abc',14:'abc',15:'abc',16:'abc',17:'abc',18:'abc' };
  function gallery(p) { var l = ['t' + p.id + 'n']; (GAL[p.id] || '').split('').forEach(function (c) { l.push('g' + p.id + c); }); if (p.id === 9) l.push('t9b'); return l; }
  function sheet() {
    var s = S.sheet; if (!s) return '';
    var end = '<div class="end"></div>', closeBtn = '<div class="closebar"><button class="close" type="button" data-act="close" aria-label="Close">&times;</button></div>';
    var p = byId(s.id);
    var imgs = gallery(p), cur = Math.min(s.img || 0, imgs.length - 1);
    var h = closeBtn + '<div class="pcols"><div><div class="hero"><img src="' + imgs[cur] + '.jpg" alt="' + esc(p.n) + '"></div>';
    if (imgs.length > 1) h += '<div class="thumbs">' + imgs.map(function (m, i) { return '<button class="thumb" type="button" data-img="' + i + '" aria-pressed="' + (i === cur) + '" aria-label="Photo ' + (i + 1) + '"><img src="' + m + '.jpg" alt=""></button>'; }).join('') + '</div>';
    h += '</div><div><span class="cat">' + p.b + ' &middot; ' + p.t + '</span><h3>' + p.n + '</h3>' + (p.bn ? '<p class="bn">' + p.bn + '</p>' : '') + priceBlock(p) + '<p>' + p.d + '</p>' + (DET[p.id] ? '<p class="bnd">' + DET[p.id].bd + '</p>' : '');
    if (p.s) h += '<div class="label">Pack</div><div class="row"><span class="size">' + p.s + '</span></div>';
    if (p.k.length) h += '<div class="label">Key ingredients</div><div class="tags">' + p.k.map(function (k) { return '<span>' + k + '</span>'; }).join('') + '</div>';
    if (p.u) h += '<div class="label">How to use <span class="bl">ব্যবহারের নিয়ম</span></div><p style="margin:0">' + p.u + '</p>' + (DET[p.id] && DET[p.id].bu ? '<p class="bnd">' + DET[p.id].bu + '</p>' : '');
    var dt = DET[p.id];
    if (dt) {
      h += '<div class="label">Why it works <span class="bl">কেন কাজ করে</span></div><div class="why">' + dt.why.map(function (w) { return '<div class="whyi"><b>' + w[0] + '<small>' + w[1] + '</small></b><p>' + w[2] + '</p><p class="bnd">' + w[3] + '</p></div>'; }).join('') + '</div>';
      h += '<div class="gk"><b>Good to know <span class="bl">জেনে রাখুন</span></b><p>' + dt.note[0] + '</p><p class="bnd">' + dt.note[1] + '</p><p class="disc">General skincare information, not medical advice. Results vary from person to person.<span class="bnd"> সাধারণ তথ্য, চিকিৎসা পরামর্শ নয়। ফল মানুষভেদে আলাদা।</span></p></div>';
    }
    h += '<div class="pricelink">' + ext(WA_CATALOG, 'ghost', ICON_WA, 'Open WhatsApp catalog') + '</div></div></div>';
    h += '<div class="buy"><div class="qty"><button type="button" data-sq="-1" aria-label="Fewer">&minus;</button><output>' + s.qty + '</output><button type="button" data-sq="1" aria-label="More">+</button></div><button class="primary" type="button" data-act="add">Add to my order</button></div>';
    if (p.poster) h += '<div class="label">Full product details</div><img class="poster" src="p' + p.id + '.jpg" alt="Product details for ' + esc(p.n) + '" loading="lazy">';
    return h + end;
  }

  var toastTimer;
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 1800); }

  function orderNo() { if (!S.orderNo) { var d = new Date(); S.orderNo = 'ZSC-' + String(d.getDate()).padStart(2, '0') + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(Math.floor(100 + Math.random() * 900)); } return S.orderNo; }
  function done() {
    var o = S.done || {};
    return '<div class="doneBox"><div class="tick" aria-hidden="true">&#10003;</div><h2 class="screen" style="margin:0">Order sent<small class="enl">অর্ডার পাঠানো হয়েছে</small></h2>' +
      '<p>Thank you' + (o.name ? ', ' + esc(o.name) : '') + '! Your order number is <b>' + esc(o.no || '') + '</b>' + (o.total ? ' (' + esc(o.total) + ')' : '') + '.</p>' +
      '<p class="hint">Press <b>Send</b> in WhatsApp if you have not yet. We will reply there to confirm your order, the delivery charge and the delivery day. Keep your order number.<small class="bsub">WhatsApp-এ Send চাপুন, অর্ডার নম্বর রাখুন</small></p>' +
      '<div class="doneBtns"><button class="primary" type="button" data-go="shop" data-home="1">' + bi('Order new products', 'নতুন পণ্য অর্ডার করুন') + '</button>' + ext(WA_CHAT, 'ghost', ICON_WA, 'Open WhatsApp chat') + '</div></div>' + footer();
  }
  function finishOrder() {
    var m = payById(S.pay);
    S.done = { no: orderNo(), name: S.form.name.trim(), total: allPriced() ? money(cartTotal()) : '' };
    S.cart = []; persist(); S.form = { name: '', phone: '', addr: '', trx: '' }; S.pay = 'cod'; S.sheet = null; S.orderNo = null; S.view = 'done';
    draw(); fadeIn(); window.scrollTo(0, 0);
  }
  function draw() {
    $('view').innerHTML = S.view === 'cart' ? cart() : S.view === 'checkout' ? checkout() : S.view === 'done' ? done() : shop();
    ['tab', 'nav'].forEach(function (k) {
      $(k + '-shop').setAttribute('aria-current', S.view === 'shop' ? 'page' : 'false');
      $(k + '-cart').setAttribute('aria-current', S.view === 'cart' || S.view === 'checkout' ? 'page' : 'false');
    });
    var n = count();
    ['dot', 'dot2'].forEach(function (id) { $(id).textContent = n; $(id).hidden = !n; });
    var sh = $('sheet');
    if (S.sheet) {
      var keep = sh.firstChild ? sh.firstChild.scrollTop : 0;
      sh.hidden = false; sh.className = 'scrim';
      sh.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + sheet() + '</div>';
      if (S.sheet.keepScroll) sh.firstChild.scrollTop = keep;
    } else { sh.hidden = true; sh.innerHTML = ''; }
    syncWa();
  }
  function toSection(id) {
    var el = $(id);
    if (!el || S.view !== 'shop') { S.view = 'shop'; S.sheet = null; if (!el) { S.cat = 'All'; S.q = ''; } draw(); fadeIn(); el = $(id); }
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function fadeIn() { var v = $('view'); v.classList.remove('vin'); void v.offsetWidth; v.classList.add('vin'); }
  function go(v) { S.view = v; S.sheet = null; draw(); fadeIn(); window.scrollTo(0, 0); }
  function addToOrder(id, qty) {
    var hit = S.cart.filter(function (x) { return x.id === id; })[0];
    if (hit) hit.qty += qty; else S.cart.push({ id: id, qty: qty });
    persist();
  }

  function orderMessage() {
    var f = S.form, m = payById(S.pay);
    var lines = S.cart.map(function (x, i) { var p = byId(x.id); return (i + 1) + '. ' + p.n + ' (' + p.b + ') x ' + x.qty + (p.pr ? ' - BDT ' + p.pr * x.qty : ''); });
    var msg = 'Hello Zoni Skin Care, I would like to order.\nOrder No: ' + orderNo() + '\nDate: ' + new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) + '\n\n' + lines.join('\n');
    if (allPriced()) msg += '\n\nOrder total before delivery: BDT ' + cartTotal();
    msg += '\n\nPayment method: ' + m.n;
    if (m.wallet) {
      msg += '\nI have paid' + (allPriced() ? ' BDT ' + cartTotal() : '') + ' to ' + (m.num || (m.bank && m.bank.acc + ' (' + m.bank.name + ')'));
      msg += '\nTransaction ID: ' + f.trx.trim();
    }
    msg += '\n\nName: ' + f.name.trim() + '\nMobile: ' + f.phone.trim() + '\nAddress: ' + f.addr.trim();
    msg += m.wallet ? '\n\nPlease verify my payment and confirm my order.' : '\n\nPlease confirm the final amount including delivery.';
    return msg;
  }

  // Keep the WhatsApp button's link filled with the order text at all times, so the first tap already carries the message.
  function syncWa() {
    var a = $('wa-send'); if (!a) return;
    var f = S.form, ok = f.name.trim() && f.phone.trim() && f.addr.trim() && (!payById(S.pay).wallet || f.trx.trim());
    a.href = ok ? WA_CHAT + '?text=' + encodeURIComponent(orderMessage()) : WA_CHAT;
  }
  document.addEventListener('input', function (e) {
    var id = e.target.id;
    if (id === 'q') { S.q = e.target.value; $('grid').innerHTML = gridHtml(); }
    if (id === 'f-name') S.form.name = e.target.value;
    if (id === 'f-phone') S.form.phone = e.target.value;
    if (id === 'f-addr') S.form.addr = e.target.value;
    if (id === 'f-trx') S.form.trx = e.target.value;
    syncWa();
  });
  document.addEventListener('change', function (e) {
    if (e.target.name !== 'pay') return;
    S.pay = e.target.value;
    $('pay-info').innerHTML = payInfo(S.pay);
    $('trx-wrap').hidden = !payById(S.pay).wallet;
    $('wa-label').innerHTML = sendLabel(S.pay);
    $('f-err').hidden = true;
    syncWa();
  });
  document.addEventListener('click', function (e) {
    var oa = e.target.closest('a[data-openapp]');
    if (oa) {
      var num = payById(oa.dataset.openapp).num;
      try { navigator.clipboard.writeText(num).catch(function () {}); } catch (x) {}
      toast('Number copied. Paste it in Send Money.');
      if (!/Android/i.test(navigator.userAgent)) { e.preventDefault(); toast('Open the ' + payById(oa.dataset.openapp).n + ' app on your phone. Number copied.'); }
      return;
    }
    var el = e.target.closest('button, .scrim, #wa-send'); if (!el) return;
    if (el.id === 'wa-send') {
      var f = S.form;
      var err = $('f-err');
      if (!f.name.trim() || !f.phone.trim() || !f.addr.trim()) { e.preventDefault(); err.textContent = ERR_FILL; err.hidden = false; return; }
      if (payById(S.pay).wallet && !f.trx.trim()) { e.preventDefault(); err.textContent = ERR_TRX; err.hidden = false; $('f-trx').focus(); return; }
      err.hidden = true; $('f-hint').hidden = false;
      var text = orderMessage();
      el.href = WA_CHAT + '?text=' + encodeURIComponent(text);
      try { navigator.clipboard.writeText(text).catch(function () {}); } catch (x) {}
      setTimeout(finishOrder, 700);
      return;
    }
    var d = el.dataset;
    if (el.classList.contains('scrim') && e.target === el) { S.sheet = null; return draw(); }
    if (d.copy) {
      var copied = function () { toast('Number copied'); }, shown = function () { toast('Number: ' + d.copy); };
      try { navigator.clipboard.writeText(d.copy).then(copied, shown); } catch (x) { shown(); }
      return;
    }
    if (d.jump) { var jt = $(d.jump); if (jt) jt.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    if (d.go) { if (d.home) { S.cat = 'All'; S.q = ''; } return go(d.go); }
    if (d.cat) { S.cat = d.cat; draw(); if (d.scroll) toSection(d.scroll); return; }
    if (d.scroll) return toSection(d.scroll);
    if (d.open) { S.sheet = { id: +d.open, qty: 1, img: 0 }; return draw(); }
    if (d.quick) { addToOrder(+d.quick, 1); draw(); return toast('Added to your order'); }
    if (d.img) { S.sheet.img = +d.img; S.sheet.keepScroll = true; return draw(); }
    if (d.sq) { S.sheet.qty = Math.max(1, Math.min(9, S.sheet.qty + +d.sq)); S.sheet.keepScroll = true; return draw(); }
    if (d.q) {
      var i = +d.q; S.cart[i].qty += +d.d;
      if (S.cart[i].qty < 1) S.cart.splice(i, 1);
      persist(); return draw();
    }
    switch (d.act) {
      case 'close': S.sheet = null; return draw();
      case 'add': addToOrder(S.sheet.id, S.sheet.qty); S.sheet = null; draw(); return toast('Added to your order');
      case 'checkout': return go('checkout');
      case 'back': return go('cart');
    }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.sheet) { S.sheet = null; draw(); } });
  draw();
  // Header: slides up when scrolling down, slides back when scrolling up
  (function () {
    var hd = document.querySelector('header.top'); if (!hd) return;
    var tb = document.querySelector('nav.tabs');
    function setHide(on) { hd.classList.toggle('hide', on); if (tb) tb.classList.toggle('hide', on); }
    var last = window.pageYOffset || 0, tick = false, acc = 0;
    function update() {
      tick = false;
      var y = Math.max(0, window.pageYOffset || 0), dy = y - last; last = y;
      var h = hd.offsetHeight || 64;
      hd.classList.toggle('scrolled', y > 4);
      if (y <= h) { acc = 0; setHide(false); return; }
      if ((dy > 0) !== (acc > 0)) acc = 0;
      acc += dy;
      if (acc > 14) setHide(true);
      else if (acc < -8) setHide(false);
    }
    window.addEventListener('scroll', function () { if (!tick) { tick = true; requestAnimationFrame(update); } }, { passive: true });
    hd.addEventListener('focusin', function () { setHide(false); });
    window.addEventListener('hashchange', function () { setHide(false); });
  })();
})();
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
